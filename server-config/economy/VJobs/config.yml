explore:
  enabled: false
  max-stored-chunks: 20000       # per player; beyond this nothing new is written to the database
  elytra-multiplier: 0.1         # share of the payout for a new chunk found while gliding
  max-chunks-per-minute: 30      # new chunks above this per player and minute pay nothing, 0 = no limit

# AUTO_SMELT perk: these drops are replaced by their smelted result. Silk touch keeps the ore.
auto-smelt:
  xp-per-item: 0.7               # experience like a furnace, 0 = none
  items:
    RAW_IRON: IRON_INGOT
    RAW_GOLD: GOLD_INGOT
    RAW_COPPER: COPPER_INGOT
    ANCIENT_DEBRIS: NETHERITE_SCRAP

# TRAVEL and ELYTRA pay per "blocks-per-payout" blocks covered. TRAVEL keys are
# WALK, SPRINT, SWIM, BOAT, MINECART or the ridden entity (HORSE, PIG, STRIDER, ...).
travel:
  enabled: false
  blocks-per-payout: 100

# /vjobs ping [target] for players with a STRUCTURE_PING perk (the explorer by default).
# It shows the direction and a rough distance to the nearest structure, never coordinates.
# A perk level unlocks every target whose "level" is at or below it. The search is spread
# over many ticks, so a ping never stalls the server. Strongholds and end cities
# are left out on purpose: the eye of ender hunt and the elytra should stay a challenge.
structure-ping:
  radius: 1500                   # blocks around the player that are searched
  cooldown-minutes: 30           # after a ping that found something
  empty-cooldown-seconds: 60     # after a ping that found nothing new
  price: 0.0                     # money per ping (Vault, PlayerPoints, CoinsEngine), 0 = free
  compass: true                  # also point the player's compass at the structure
  skip-explored: true            # ignore structures in chunks the player has already explored
  targets:
    village: { level: 1, structures: [village_plains, village_desert, village_savanna, village_snowy, village_taiga] }
    temple: { level: 1, structures: [desert_pyramid, jungle_pyramid] }
    shipwreck: { level: 2, structures: [shipwreck, shipwreck_beached] }
    ocean_ruin: { level: 2, structures: [ocean_ruin_cold, ocean_ruin_warm] }
    ruined_portal: { level: 2, structures: [ruined_portal, ruined_portal_desert, ruined_portal_jungle, ruined_portal_swamp, ruined_portal_mountain, ruined_portal_ocean] }
    outpost: { level: 2, structures: [pillager_outpost] }
    witch_hut: { level: 2, structures: [swamp_hut] }
    igloo: { level: 2, structures: [igloo] }
    monument: { level: 3, structures: [monument] }
    mansion: { level: 3, structures: [mansion] }
    trail_ruins: { level: 3, structures: [trail_ruins] }
    trial_chambers: { level: 4, structures: [trial_chambers] }
    fortress: { level: 4, structures: [fortress] }
    bastion: { level: 4, structures: [bastion_remnant] }
    ancient_city: { level: 5, structures: [ancient_city] }

# ECONOMY.md 2.2: 보상은 정수만. 배율이 1이 아니면 소수 금액이 생겨 Bank가 입금을 거부하므로 전부 비움.
multipliers:
  worlds: {}
  permissions: {}
  boost:
    active: false
    multiplier: 1.0
    jobs: []
    until-unix-millis: 0
  items: {}

# ECONOMY.md 2.2: 감소 보상(diminishing-returns)은 소수 금액을 만들므로 끔.

# Economy and balance.
#  default-backend   where payouts go: vault, playerpoints, coinsengine,
#                    coinsengine:<currency>, command, or an id another plugin
#                    registered through the API. A job can override it with "economy:".
#  command           used by the "command" backend for currencies without an API
#  tax               a share of every payout goes into a fund instead of the player;
#                    with fund-account set it is paid into that Vault account,
#                    otherwise it is kept for /vjobs admin fund
#  daily-limit       money cap per job and day; permissions multiply the cap
#  diminishing-returns  after "free-actions" paid actions of one job inside the
#                    window, every further "step" actions pay "reduction-per-step" less
#  dynamic-prices    actions the whole server does a lot pay less, rare ones more.
#                    expected-per-hour is what counts as normal for one action key.
economy:
  default-backend: vault
  coinsengine-currency: coins
  command:
    give: "eco give %player% %amount%"
    format: "%amount%"
  tax:
    enabled: false
    percent: 5.0
    fund-account: ""
  daily-limit:
    enabled: false
    default: 10000.0
    jobs:
      miner: 8000.0
    permissions:
      jobs.dailylimit.vip: 1.5
      jobs.dailylimit.mvp: 2.0
  diminishing-returns:
    enabled: false
    window-seconds: 300
    free-actions: 400
    step: 100
    reduction-per-step: 0.1
    minimum-factor: 0.25
  dynamic-prices:
    enabled: false
    half-life-minutes: 60
    expected-per-hour: 2000
    elasticity: 0.35
    min-factor: 0.5
    max-factor: 1.5

# Prefix for chat (%prefix%) and PlaceholderAPI (%jobs_prefix%, %jobs_prefix_<job>%).
# Placeholders: %job% %title% %level% %prestige% %stars%
