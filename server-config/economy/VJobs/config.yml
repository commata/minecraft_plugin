# =====================================================================
#  VJobs 설정 - 야생 서버 경제 (docs/ECONOMY.md v0.8, 5장)
#  원본: server-config/economy/VJobs/config.yml (레포). 서버에서 직접 고치지 말고 PR로 바꾼 뒤 복사.
#  /vjobs admin editor 는 쓰지 않는다 (파일 전체를 다시 써서 주석이 사라짐).
#  모든 섹션을 남겨 둔 이유: 섹션이 없으면 VJobs가 JAR 안의 기본값(18개 직업, 배율 등)을 읽음.
# =====================================================================

# Used by updates to add new options to this file. Do not change it.
version: 3

# Looks for new VJobs versions on Modrinth. A release build only follows releases, a beta
# build follows betas too. auto-download puts the new jar into the server's update folder,
# it is installed on the next restart. New config options arrive on their own after that.
updates:
  check: true
  check-interval-hours: 6
  notify-admins: true            # tell players with jobs.admin on join
  auto-download: false

storage:
  type: sqlite               # sqlite or mysql
  filename: local.db
  mysql:
    host: localhost
    port: 3306
    database: vjobs
    user: root
    password: ""
    ssl: false
    pool-size: 10

autosave:
  interval-minutes: 5

locale:
  default: ko                # messages_ko.yml (server-config/economy/VJobs/)
  use-client-locale: false

messages:
  prefix: "&8[&6직업&8] &r"

# How payouts are shown. Payouts within "aggregate-ticks" are summed up into one
# line ("+12.50 $ | +8 XP") instead of one message per block.
#  payout-display: ACTIONBAR, BOSSBAR, CHAT or NONE
#  The boss bar also shows the progress towards the next level.
notifications:
  payout-display: ACTIONBAR
  aggregate-ticks: 30
  bossbar-color: GREEN
  bossbar-seconds: 3

# Chat integration: shows the player's job title in front of their message.
# Off by default so dedicated chat plugins keep control of the format.
# Placeholders: %player% %message% %job% %title% %title_full% %level% %prestige% %prefix%
chat:
  enabled: false
  format: "&8[&6%title%&8] &r%player%&7: &f%message%"

signs:
  refresh-seconds: 60        # how often [VJobs] toplist signs are redrawn

# ECONOMY.md 5.1: 동시 가입 최대 2개. LuckPerms jobs.limit.2 없이도 기본값으로 2개.
jobs-limit:
  default: 2

# Cooldown before a player may take on a new job after last joining/leaving a job.
# default-seconds applies if the player has NONE of the cooldown permissions listed below
# (e.g. 86400 = only 1x per day). If a player has one or more of the permissions, the
# SHORTEST matching value applies.
# ECONOMY.md 5.1: 1시간. VJobs는 첫 직업 가입에도 쿨타임을 걸어서 24시간이면 오픈 날 두 번째 직업을 못 고름.
job-switch-cooldown:
  default-seconds: 3600
  permissions:
    jobs.cooldown.hour: 3600
    jobs.cooldown.instant: 0

# ECONOMY.md 5.1: 탈퇴해도 레벨 유지(재가입 시 복구).
leave-penalty:
  level-loss-percent: 0.0
  keep-progress: true   # 레벨만 유지. 현재 레벨에서 쌓던 XP는 재가입 때 0 (2.2.0 실제 동작, ECONOMY.md 5.1)

# Caps how much money a single player can earn from jobs per interval.
# XP is never capped, only the payout.
income-limit:
  enabled: false
  interval-seconds: 3600
  max-money: 5000.0

# Anti-exploit measures.
#  block-cooldown-seconds     same spot only pays again after this many seconds
#  deny-player-placed-blocks  breaking a block you placed yourself pays nothing
#                             (crops you planted still pay once they are grown)
#  persist-placed-blocks      remember placed blocks in the chunk data, so a restart
#                             doesn't turn them into paying blocks again
#  player-placed-track-limit  only used when persist-placed-blocks is false
#  spawner-mob-multiplier     share of the payout for mobs from monster spawners
#                             (0.0 = nothing, 0.25 = a quarter, 1.0 = full)
#  deny-creative              creative and spectator mode never pay
#  deny-tamed-animals         killing tamed animals pays nothing
#  afk                        no payouts after this long without looking around,
#                             typing or clicking (stops water and piston farms)
#  silk-touch                 breaking these blocks with silk touch pays nothing,
#                             so the mine-place-mine loop is worthless
#  worldguard-flag            honour the WorldGuard region flag "vjobs-payout"
anti-exploit:
  block-cooldown-seconds: 10
  deny-player-placed-blocks: true
  persist-placed-blocks: true
  player-placed-track-limit: 50000
  spawner-mob-multiplier: 0.0
  deny-creative: true
  deny-tamed-animals: true
  disabled-worlds: []
  afk:
    enabled: true
    timeout-seconds: 300
  silk-touch:
    pays: false
    blocks: ["*_ORE", ANCIENT_DEBRIS]
  worldguard-flag: true

# ECONOMY.md 5.3: 레벨 n -> n+1 필요 경험치 = 440 * n^0.6.
# VJobs는 레벨 L에서 다음 레벨로 갈 때 이 식을 level = L+1로 계산하므로 (level - 1)을 씀.
# Lv1->2: 440, Lv10->11: 1,752, Lv49->50: 4,545
xp-curve:
  xp-base: 440
  xp-exponent: 0.6
  max-level: 50
  formula: "base * (level - 1) ^ exponent"

# Payout formulas. Variables: money, xp (values from the job entry), multiplier
# (world/permission/boost/prestige combined), level, prestige.
# Example for a level-scaled income: "money * multiplier * (1 + level / 100)"
formulas:
  money: "money * multiplier"
  xp: "xp * multiplier"

# ECONOMY.md 5.1: 프레스티지 비활성화
prestige:
  enabled: false
  from-level: 50
  max-tier: 0
  bonus-per-tier-percent: 0.0

sounds:
  levelup:
    enabled: true
    sound: ENTITY_PLAYER_LEVELUP
    volume: 1.0
    pitch: 1.0

# ECONOMY.md 1장 5번: 돈 공급은 직업 보상 하나. 퀘스트 보상(추가 공급원)은 끔.

