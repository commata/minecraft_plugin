  prefix: "&8[&6%title% &e%stars%&8]"
  prefix-no-prestige: "&8[&6%title%&8]"

# ECONOMY.md 5.1: 능력치 특전 없음 (DOUBLE_DROP·MONEY_BONUS 등은 매입·정수 보상과 충돌)
perks:
  enabled: false
  points-per-level: 0
  points-per-prestige: 0
  jobs: {}

# 예약 부스트 없음 (2.2 정수 보상)
boost-events: {}

# 대회 보상·예약 없음 (추가 돈 공급원 금지)
contests:
  metric: MONEY
  announce-interval-minutes: 15
  rewards: {}
  schedule: {}

# Shared goals for towns, lands or clans. Every online member gets the reward when
# the group reaches the amount. provider: auto, towny, lands, simpleclans, or an id
# registered through the API. period: daily or weekly.
team-goals:
  enabled: false
  provider: auto
  period: weekly
  goals:
    city_mine:
      job: miner
      action: BREAK
      targets: []
      amount: 20000
      display-name: "City mine"
      reward: { money: 500.0, commands: [] }

# How often leaderboards (signs, menus, %jobs_top_...% placeholders) are read from the database.
leaderboards:
  cache-seconds: 60

# %jobs_progress_bar_<job>%
placeholders:
  progress-bar-length: 10
  progress-bar-full: "&a|"
  progress-bar-empty: "&7|"

# Posts to a Discord channel through a webhook (Channel settings > Integrations).
discord:
  enabled: false
  webhook-url: ""
  username: "VJobs"
  milestone-levels: [25, 50, 75, 100]
  on-prestige: true
  on-contest: true
  messages:
    level: "**%player%** reached level %level% as %job%."
    prestige: "**%player%** reached prestige %prestige% as %job%."
    contest: "The %job% contest is over. Winner: **%player%**"

