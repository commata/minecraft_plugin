# /home, /tpa 설정. 바꾼 뒤 /home reload (OP) 로 적용합니다.
# 예전 Home 플러그인(plugins/Home/config.yml)을 쓰던 서버라면 처음 켜질 때 그 값을 옮겨 옵니다.

home:
  # /home 입력 후 집으로 이동하기까지 기다리는 시간(초). 0이면 바로 이동.
  cast-seconds: 7
  # 귀환에 성공한 뒤 다시 쓸 수 있을 때까지의 시간(초). OP(home.bypass.cooldown)는 무시합니다.
  # 블록 설치 등 스스로 한 행동으로 취소된 경우에는 쿨타임이 없습니다.
  cooldown-seconds: 300

tpa:
  # 수락 후 이동하기까지 기다리는 시간(초). 0이면 수락 즉시 이동 (요청을 기다리는 시간이 이미 있으므로).
  # 0보다 크게 하면 /home 과 같은 취소 규칙(블록 설치, 피해 등)이 적용됩니다.
  cast-seconds: 0
  # /tpa 로 이동에 성공한 뒤 다시 이동할 수 있을 때까지의 시간(초). /home 쿨타임과 따로 셉니다.
  # OP(tpa.bypass.cooldown)는 무시합니다. 거절·만료·취소로 끝나면 쿨타임이 없습니다.
  cooldown-seconds: 300
  # 보낸 요청이 자동으로 만료되는 시간(초). 최소 5초.
  request-seconds: 60
  # 같은 사람에게 다시 요청을 보낼 수 있을 때까지의 시간(초). 도배 방지.
  resend-seconds: 10

combat:
  # 몬스터에게 맞거나 몬스터를 때린 뒤 /home, /tpa 를 쓸 수 없는 시간(초). 0이면 사용 안 함.
  mob-seconds: 15
  # 다른 플레이어를 때리거나 맞은 뒤(양쪽 모두) /home, /tpa 를 쓸 수 없는 시간(초). 0이면 사용 안 함.
  # 서버에서 PvP가 꺼져 있으면 피해 자체가 막히므로 이 제한도 걸리지 않습니다.
  pvp-seconds: 30

safety:
  # 이동 직전에 이보다 많이(블록) 떨어지고 있으면 이동하지 않습니다 (낙하 피해 회피 방지).
  # /tpa 를 받는 사람에게도 같은 기준을 씁니다.
  max-fall-distance: 3.0
