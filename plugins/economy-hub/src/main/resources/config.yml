# EconomyHub 설정 (docs/ECONOMY.md 5.1, 7.2). 바꾼 뒤 /economyhub reload

job-cooldown:
  # 직업을 그만둔 뒤 새 직업에 가입할 수 없는 시간(분). 빈 슬롯을 처음 채울 때는 바로 가입.
  # VJobs config.yml 의 job-switch-cooldown.default-seconds 와 같은 값(60분 = 3600초)으로 둔다.
  after-leave-minutes: 60

payout-guard:
  # 피스톤으로 움직인 블록과 용암·물로 생긴 돌·조약돌·현무암은 캐도 직업 보상을 주지 않는다.
  enabled: true
  # 유체로 생겼을 때 표시할 블록
  formed-blocks: [STONE, COBBLESTONE, BASALT]
  # 청크 하나에 기억하는 표시 수 상한 (넘으면 오래된 것부터 지움)
  max-marks-per-chunk: 4096
