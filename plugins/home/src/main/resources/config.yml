# /home 귀환 설정. 바꾼 뒤 /home reload (OP) 로 적용합니다.

# /home 입력 후 집으로 이동하기까지 기다리는 시간(초). 0이면 바로 이동.
cast-seconds: 7

# 귀환에 성공한 뒤 다시 쓸 수 있을 때까지의 시간(초). OP(home.bypass.cooldown)는 무시합니다.
# 블록 설치 등 스스로 한 행동으로 취소된 경우에는 쿨타임이 없습니다.
cooldown-seconds: 300

combat:
  # 몬스터에게 맞거나 몬스터를 때린 뒤 귀환할 수 없는 시간(초). 0이면 사용 안 함.
  mob-seconds: 15
  # 다른 플레이어를 때리거나 맞은 뒤(양쪽 모두) 귀환할 수 없는 시간(초). 0이면 사용 안 함.
  # 서버에서 PvP가 꺼져 있으면 피해 자체가 막히므로 이 제한도 걸리지 않습니다.
  pvp-seconds: 30

safety:
  # 이동 직전에 이보다 많이(블록) 떨어지고 있으면 귀환하지 않습니다 (낙하 피해 회피 방지).
  max-fall-distance: 3.0
